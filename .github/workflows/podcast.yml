name: Build morning brief episode

on:
  schedule:
    # 07:32 and 08:02 Tehran (UTC+3:30). Off-the-hour minutes are dropped less
    # often by GitHub; the second run is a backup (the build is idempotent).
    - cron: "2 4 * * *"
    - cron: "32 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build episode and feed
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          PODCAST_TOKEN: ${{ secrets.PODCAST_TOKEN }}
          TTS_VOICE: en-US-EmmaMultilingualNeural
        run: python build_episode.py

      - name: Publish
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs
          git commit -m "Episode $(date -u +%F)" || echo "Nothing to commit"
          git push
